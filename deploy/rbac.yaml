---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asg-ami-rotator
  namespace: asg-ami-rotator
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::986119050365:role/asg-ami-rotater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: asg-ami-rotator
rules:
  # Read nodes, cordon (patch), and delete them.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  # Drain: list pods and evict them (respecting PodDisruptionBudgets).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Drain needs to inspect the owning controllers of pods.
  - apiGroups: ["apps"]
    resources: ["daemonsets", "replicasets", "statefulsets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: asg-ami-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: asg-ami-rotator
subjects:
  - kind: ServiceAccount
    name: asg-ami-rotator
    namespace: asg-ami-rotator
---
# Leader-election lease lives in the controller's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: asg-ami-rotator-leader-election
  namespace: asg-ami-rotator
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: asg-ami-rotator-leader-election
  namespace: asg-ami-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: asg-ami-rotator-leader-election
subjects:
  - kind: ServiceAccount
    name: asg-ami-rotator
    namespace: asg-ami-rotator
