---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asg-ami-rotator
  namespace: asg-ami-rotator
  labels:
    app.kubernetes.io/name: asg-ami-rotator
spec:
  # Leader election keeps only one replica active; a second gives fast failover.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asg-ami-rotator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asg-ami-rotator
    spec:
      serviceAccountName: asg-ami-rotator
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Run on Karpenter on-demand capacity: this controller manages the
      # bootstrap ASG nodes, so it must not run on them.
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: controller
          image: 986119050365.dkr.ecr.eu-west-2.amazonaws.com/images/asg-ami-rotater:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --asg-names=$(ASG_NAMES)
            - --region=$(AWS_REGION)
            - --poll-interval=60s
            - --leader-elect=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ASG_NAMES
              value: "eks-nodes-dev"
            - name: AWS_REGION
              value: "eu-west-2"
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
